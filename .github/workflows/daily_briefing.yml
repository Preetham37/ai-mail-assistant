name: Daily Email Briefings (Morning & Evening)

on:
  schedule:
    # 02:25 UTC = 07:55 AM IST (Indian Standard Time) — Morning Kickoff Briefing
    - cron: '25 2 * * *'
    # 13:05 UTC = 06:35 PM IST (Indian Standard Time) — Evening Workday Wrap-Up
    - cron: '5 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Briefing Mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

permissions:
  contents: write

jobs:
  email-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch & Summarize Emails with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_ACCOUNTS_JSON: ${{ secrets.GMAIL_ACCOUNTS_JSON }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python gmail/gmail.py --mode "$MODE"

      - name: Push Briefing to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python discord_notifier.py --mode "$MODE"

      - name: Commit and Push Updated Briefing Data
        run: |
          git config --global user.name "BriefingOS Bot"
          git config --global user.email "bot@briefingos.local"
          git add gmail/data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json."
          else
            git commit -m "chore(data): auto-update briefing data [skip ci]"
            git push origin main
          fi
